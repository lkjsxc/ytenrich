name: Latest build

# Every push to main refreshes the "latest-build" pre-release, so the newest code is always downloadable
# without waiting for a version or a store. Store releases stay in store-release.yml (v* tags only).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: latest-build
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'lkjsxc/ytenrich'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm package
      - name: Publish the pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'require("./package.json").version')
          cp "release/ytenrich-$version-chromium.zip" release/ytenrich-chromium.zip
          cp "release/ytenrich-$version-firefox.zip" release/ytenrich-firefox.zip
          notes="Built from main at ${GITHUB_SHA::7} on $(date -u +%F). Newer than the stores and possibly less tested. Install steps: README, \"From GitHub\"."
          if gh release view latest-build --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/latest-build" -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release edit latest-build --repo "$GITHUB_REPOSITORY" --title "Latest build ($version+${GITHUB_SHA::7})" --notes "$notes" --prerelease
          else
            gh release create latest-build --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "Latest build ($version+${GITHUB_SHA::7})" --notes "$notes"
          fi
          gh release upload latest-build release/ytenrich-chromium.zip release/ytenrich-firefox.zip --clobber --repo "$GITHUB_REPOSITORY"
