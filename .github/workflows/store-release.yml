name: Browser stores

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'push' && 'browser-store-release' || format('browser-store-preview-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Verify release version and ref
        id: version
        shell: bash
        run: |
          version=$(node -p 'require("./package.json").version')
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*)){2}$ ]]; then
            echo 'package.json must use a numeric major.minor.patch version.' >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            if [[ "$GITHUB_REF" != "refs/tags/v$version" ]]; then
              echo "Expected tag v$version to match package.json." >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
              echo 'Release tags must point to a commit on main.' >&2
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: store-packages
          path: release/ytenrich-*.zip
          if-no-files-found: error
          overwrite: true
          compression-level: 0

  chrome:
    name: Submit to Chrome
    if: github.event_name == 'push' && github.repository == 'lkjsxc/ytenrich'
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: browser-stores
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: store-packages
          path: release
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        id: auth
        with:
          workload_identity_provider: ${{ vars.CHROME_WIF_PROVIDER }}
          service_account: ${{ vars.CHROME_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          create_credentials_file: false
      - run: node scripts/submit-store.ts chrome "$RELEASE_VERSION"
        env:
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
          CHROME_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}

  submit:
    name: Submit to ${{ matrix.store }}
    if: github.event_name == 'push' && github.repository == 'lkjsxc/ytenrich'
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: browser-stores
    strategy:
      fail-fast: false
      matrix:
        store: [edge, firefox]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: store-packages
          path: release
      - run: node scripts/submit-store.ts "$STORE" "$RELEASE_VERSION"
        env:
          STORE: ${{ matrix.store }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
          EDGE_CLIENT_ID: ${{ matrix.store == 'edge' && secrets.EDGE_CLIENT_ID || '' }}
          EDGE_API_KEY: ${{ matrix.store == 'edge' && secrets.EDGE_API_KEY || '' }}
          AMO_API_KEY: ${{ matrix.store == 'firefox' && secrets.AMO_API_KEY || '' }}
          AMO_API_SECRET: ${{ matrix.store == 'firefox' && secrets.AMO_API_SECRET || '' }}
